[categories.webinar]
description = "Courses, presentations and recorded sessions, mostly screen sharing."
location = "keep"

[categories.webinar.portable]
encoder = "libx265"
quality_crf = 28
speed_preset = "slow"
extra_encoder_params = ""
deblocking = "default"
bit_depth = 10
scale_short_side = 0
audio_codec = "opus"
audio_bitrate_bps = 48000
audio_channel_rule = "dual-mono-to-mono-otherwise-stereo"
audio_dual_mono_bitrate_bps = 24000
keyframe_interval_seconds = 5
copy_video_below_bps = 300000
drop_repeated_frames = false
max_frame_rate = 25

[categories.webinar.desktop]
encoder = "libsvtav1"
quality_crf = 50
speed_preset = "4"
extra_encoder_params = "tune=1:enable-variance-boost=1:ac-bias=1.0:tf-strength=1:sharpness=1:enable-qm=1:qm-min=2:scm=1"
deblocking = "default"
bit_depth = 10
scale_short_side = 0
audio_codec = "opus"
audio_bitrate_bps = 48000
audio_channel_rule = "dual-mono-to-mono-otherwise-stereo"
audio_dual_mono_bitrate_bps = 24000
keyframe_interval_seconds = 5
copy_video_below_bps = "never"
drop_repeated_frames = true
max_frame_rate = 25

