# Same value keys and units as presets --json and user overlays.

[categories.apartment-tour]
description = "Walking tours of rooms and apartments."
location = "keep"

[categories.apartment-tour.portable]
encoder = "libx265"
quality_crf = 28
speed_preset = "slow"
extra_encoder_params = ""
deblocking = "default"
bit_depth = 10
scale_short_side = 0
audio_codec = "opus"
audio_bitrate_bps = 48000
audio_channel_rule = "preserve"
audio_dual_mono_bitrate_bps = 48000
keyframe_interval_seconds = 2
copy_video_below_bps = 1500000
drop_repeated_frames = false
max_frame_rate = "native"

