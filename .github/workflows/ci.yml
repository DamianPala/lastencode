name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Verify lint environment
        run: |
          uv --version
          uv run --frozen python --version
      - run: uv run --frozen ruff check
      - run: uv run --frozen ruff format --check
      - run: uv run --frozen pyright
      - run: uv run --frozen pyright --pythonplatform Windows
      - run: uv run --frozen pyright --pythonplatform Darwin

  test-no-media:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Verify environment and test without media tools
        run: uv run --frozen python .github/scripts/test_no_media.py

  test-media:
    needs: test-no-media
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # One-line inputs if the pinned date expires or BtbN changes its asset naming.
      BTBN_RELEASE_DATE: '2026-10-12'
      BTBN_LINUX_ASSET: 'ffmpeg-n9.0*-linux64-gpl-9.0.tar.xz'
      BTBN_WINDOWS_ASSET: 'ffmpeg-n9.0*-win64-gpl-9.0.zip'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Install BtbN ffmpeg 9 (dated release, GPL)
        if: runner.os != 'macOS'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --frozen python .github/scripts/install_ffmpeg.py
      - name: Install Linux exiftool
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl
      - name: Install Windows exiftool
        if: runner.os == 'Windows'
        run: choco install exiftool --yes --no-progress
      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: brew install ffmpeg exiftool
      - name: Verify versions and every required encoder
        run: uv run --frozen python .github/scripts/verify_media.py
      - run: uv run --frozen pytest -ra

  test-bench:
    needs: test-media
    runs-on: ubuntu-latest
    env:
      # One-line inputs if the pinned date expires or BtbN changes its asset naming.
      BTBN_RELEASE_DATE: '2026-10-12'
      BTBN_LINUX_ASSET: 'ffmpeg-n9.0*-linux64-gpl-9.0.tar.xz'
      BTBN_WINDOWS_ASSET: 'ffmpeg-n9.0*-win64-gpl-9.0.zip'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Install BtbN ffmpeg 9 (dated release, GPL)
        if: runner.os != 'macOS'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --frozen python .github/scripts/install_ffmpeg.py
      - name: Install Linux exiftool
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl
      - name: Install Windows exiftool
        if: runner.os == 'Windows'
        run: choco install exiftool --yes --no-progress
      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: brew install ffmpeg exiftool
      - name: Verify versions, encoders and bench filters
        run: uv run --frozen python .github/scripts/verify_media.py --bench
      - run: uv run --frozen pytest -m slow -ra
